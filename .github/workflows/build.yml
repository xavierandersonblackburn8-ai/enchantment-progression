name: Build Enchantment Progression
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source and UI assets
        run: |
          cat source/min00.b64 source/min01.b64 | base64 -d > source.tgz
          mkdir project
          tar -xzf source.tgz -C project
          cp patches/ProgressionScreen.java project/src/client/java/com/dark/enchantmentprogression/client/ProgressionScreen.java
          cp patches/InventoryButtonInstaller.java project/src/client/java/com/dark/enchantmentprogression/client/InventoryButtonInstaller.java
          cp patches/ServerUpgradeService.java project/src/main/java/com/dark/enchantmentprogression/ServerUpgradeService.java
          python3 tools/generate_gothic_ui.py
          python3 tools/patch_ui_source.py
          sed -i 's/version=0.4.2-alpha/version=0.6.0-alpha/' project/gradle.properties
          sed -i 's/modImplementation /implementation /g' project/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build Fabric mod
        working-directory: project
        run: gradle clean build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EnchantmentProgression-26.3-Gothic-0.6.0
          path: project/build/libs/*.jar
          if-no-files-found: error
