name: Build Enchantment Progression

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source checkpoint
        run: |
          cat source.b64.part00 source.b64.part01 source.b64.part02 source.b64.part03 source.b64.part04 source.b64.part05 source.b64.part06 | base64 -d > source.zip
          python3 - <<'PY'
          import zipfile, os
          z = zipfile.ZipFile('source.zip')
          print('zip entries:', len(z.infolist()))
          bad = z.testzip()
          print('first bad entry:', bad)
          os.mkdir('project')
          z.extractall('project')
          PY
          ls -la project

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Verify toolchain
        working-directory: project
        run: |
          java -version
          gradle --version

      - name: Run pure Java tests
        working-directory: project
        run: bash ./run-core-tests.sh

      - name: Verify source invariants
        working-directory: project
        run: python3 ./verify-source-invariants.py

      - name: Build Fabric mod
        working-directory: project
        run: gradle clean build --stacktrace --no-daemon

      - name: Upload build jars
        uses: actions/upload-artifact@v4
        with:
          name: EnchantmentProgression-26.3
          path: project/build/libs/*.jar
          if-no-files-found: error
